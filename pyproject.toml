[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-cloak"
version = "0.1.0"
description = "Local, reversible secret/PII redaction proxy for Model Context Protocol (MCP) traffic."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dhanush Shankar", email = "danushankar3@gmail.com" }]
keywords = ["mcp", "ai-security", "pii", "redaction", "model-context-protocol", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Zero required runtime dependencies: the regex/entropy path is pure stdlib.
dependencies = []

[project.optional-dependencies]
# Richer PII detection via Microsoft Presidio (optional; regex path is complete).
presidio = ["presidio-analyzer>=2.2", "spacy>=3.7"]
# Test + dev tooling. Install with:  pip install -e ".[dev]"
dev = ["pytest>=8.0", "hypothesis>=6.0"]

[project.urls]
Homepage = "https://github.com/Danush-Aries/mcp-cloak"
Repository = "https://github.com/Danush-Aries/mcp-cloak"

[project.scripts]
mcp-cloak = "mcp_cloak.cli:main"

[tool.setuptools]
packages = ["mcp_cloak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
